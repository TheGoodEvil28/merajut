name: marajut-openwa

# Start explicitly with --env-file .env.openwa -f compose.openwa.yaml.
services:
  openwa:
    image: rmyndharis/openwa:0.32.1@sha256:efe56e49e66c0ff7dacd7de68e023c2b02f44b24c8885ced3e6599d465f8ce96
    restart: unless-stopped
    stop_grace_period: 90s
    command: ["sh", "-c", "umask 077 && chmod 700 /app/data && exec node dist/main"]
    ports:
      - "127.0.0.1:${OPENWA_PORT:-2785}:2785"
    environment:
      NODE_ENV: production
      PORT: "2785"
      ENGINE_TYPE: baileys
      API_MASTER_KEY: ${OPENWA_ADMIN_API_KEY:?Set OPENWA_ADMIN_API_KEY in .env.openwa}
      API_KEY_PEPPER: ${OPENWA_API_KEY_PEPPER:?Set OPENWA_API_KEY_PEPPER in .env.openwa}
      AUTO_START_SESSIONS: "true"
      MAX_CONCURRENT_SESSIONS: "1"
      BAILEYS_MARK_ONLINE_ON_CONNECT: "false"
      BAILEYS_SYNC_FULL_HISTORY: "false"
      CORS_ORIGINS: http://localhost:${OPENWA_PORT:-2785},http://127.0.0.1:${OPENWA_PORT:-2785}
      # The dashboard is reached through a localhost SSH forward.
      CSP_UPGRADE_INSECURE_REQUESTS: "false"
      WEBHOOK_SSRF_PROTECT: "true"
      SSRF_ALLOWED_HOSTS: marajut-dispatch-callback
      WEBHOOK_MAX_PAYLOAD_BYTES: "65536"
      WEBHOOK_MEDIA_INLINE_MAX_BYTES: "0"
    volumes:
      - openwa-data:/app/data
    networks:
      - dispatch
      - egress
    # worker3's Docker runtime rejects process startup with no-new-privileges.
    # The upstream entrypoint drops to the unprivileged openwa user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 2g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2785/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  dispatch:
    internal: true
  egress:

volumes:
  openwa-data:
