name: marajut-preview-qa

x-preview-app: &preview-app
  image: ${PREVIEW_IMAGE:-marajut-preview:local}
x-preview-origin: &preview-origin "https://${PREVIEW_APP_HOST:-localhost}:${PREVIEW_HTTPS_PORT:-443}"

services:
  web:
    <<: *preview-app
    ports: !reset []
    networks: [default, edge]
    environment:
      APP_ORIGIN: *preview-origin
      TRUST_PROXY_HOPS: "1"
      PAYMENT_MODE: demo
      MESSAGING_MODE: simulated
      MIDTRANS_SERVER_KEY: ""
      ADMIN_WHATSAPP: ""
      SIMULATION_WEBHOOK_SECRET: ""

  worker:
    <<: *preview-app
    environment:
      APP_ORIGIN: *preview-origin
      MESSAGING_MODE: simulated

  migrate:
    <<: *preview-app

  seed:
    <<: *preview-app

  test:
    <<: *preview-app

  mail:
    ports: !reset []
    networks: [default, edge]

  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    networks: [edge]
    environment:
      PREVIEW_ORIGIN: *preview-origin
      PREVIEW_MAIL_HOST: "${PREVIEW_MAIL_HOST:-127.0.0.1}"
      PREVIEW_MAIL_ORIGIN: "https://${PREVIEW_MAIL_HOST:-127.0.0.1}:${PREVIEW_HTTPS_PORT:-443}"
    ports:
      - "${PREVIEW_BIND_ADDRESS:-127.0.0.1}:${PREVIEW_HTTP_PORT:-80}:80"
      - "${PREVIEW_BIND_ADDRESS:-127.0.0.1}:${PREVIEW_HTTPS_PORT:-443}:${PREVIEW_HTTPS_PORT:-443}"
    depends_on:
      web: { condition: service_healthy }
      mail: { condition: service_started }
    secrets: [preview_testers, preview_qa]
    volumes:
      - ./infra/Caddyfile.preview:/etc/caddy/Caddyfile:ro
      - preview_tls:/data

networks:
  default:
    internal: true
  edge:

secrets:
  preview_testers:
    file: ${PREVIEW_TESTERS_FILE:?Set PREVIEW_TESTERS_FILE to a Caddy username and password hash file}
  preview_qa:
    file: ${PREVIEW_QA_FILE:?Set PREVIEW_QA_FILE to a Caddy username and password hash file}

volumes:
  preview_tls:
